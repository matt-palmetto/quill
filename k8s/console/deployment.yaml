# Next.js standalone console (CONTRACT.md `quill-console`, svc 80 -> 8080).
# Cloudflare Access env vars are optional here: the console works
# unauthenticated-at-the-app-layer until the tunnel + Access app are
# provisioned (see cloudflared/deployment.yaml prerequisites), matching the
# azalea-console pattern (platform/infra/cluster-node/azalea-console.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quill-console
  namespace: quill
  labels:
    app: quill-console
    app.kubernetes.io/part-of: quill
    app.kubernetes.io/component: console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quill-console
  template:
    metadata:
      labels:
        app: quill-console
        app.kubernetes.io/part-of: quill
        app.kubernetes.io/component: console
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          # Tag placeholder; digest-pin before prod.
          image: REGISTRY_HOST:5000/quill/console:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: QUILL_API_URL
              value: http://quill-api:8080
            - name: CF_ACCESS_TEAM_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: quill-console-auth
                  key: CF_ACCESS_TEAM_DOMAIN
                  optional: true
            - name: CF_ACCESS_AUD
              valueFrom:
                secretKeyRef:
                  name: quill-console-auth
                  key: CF_ACCESS_AUD
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: quill-console
  namespace: quill
  labels:
    app: quill-console
    app.kubernetes.io/part-of: quill
    app.kubernetes.io/component: console
spec:
  type: ClusterIP
  selector:
    app: quill-console
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
