# Default-deny + scoped ingress/egress for the quill namespace, mirroring
# gtm-brain's fail-closed pattern (m7-sales/k8s/brain/networkpolicy.yaml).
#
# CNPG exception (read before editing): the CNPG instance manager running
# inside every quill-pg pod talks directly to the Kubernetes API server
# (status/condition updates, TLS secret rotation, leader-election
# bookkeeping) for as long as the pod lives — not just at bootstrap. On k3s
# the API server has no stable in-namespace podSelector/namespaceSelector
# target (it runs embedded in the k3s server process on the host, not as a
# normal pod), and this repo has no confirmed value for the cluster's
# service-CIDR/API-server ClusterIP to use in an ipBlock rule. Guessing one
# risks either a silent no-op (wrong CIDR) or, worse, looking like a
# working restriction while leaving a real gap. Rather than guess, egress
# is left unrestricted for quill-pg pods specifically (ingress to 5432 is
# still locked down to pipeline+api below) — this is a deliberate, narrower
# deviation from "default-deny both directions for the whole namespace",
# flagged for the integrator to tighten once the cluster's API server
# address is confirmed (`kubectl get svc kubernetes -n default`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quill-default-deny-ingress
  namespace: quill
  labels:
    app.kubernetes.io/part-of: quill
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quill-default-deny-egress
  namespace: quill
  labels:
    app.kubernetes.io/part-of: quill
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: NotIn
        values: ["quill-pg"]
  policyTypes:
    - Egress
---
# Every restricted pod may resolve DNS. quill-pg MUST stay unselected here:
# being selected by ANY Egress-type policy makes a pod deny-by-default, so a
# podSelector:{} version of this policy silently re-restricted quill-pg to
# DNS-only and broke CNPG's API-server access (initdb crash-looped on
# 10.43.0.1:443, found 2026-08-06 first deploy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quill-dns-egress
  namespace: quill
  labels:
    app.kubernetes.io/part-of: quill
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: NotIn
        values: ["quill-pg"]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Postgres (CNPG-managed): ingress on 5432 from pipeline + api only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quill-pg-ingress
  namespace: quill
  labels:
    app.kubernetes.io/part-of: quill
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: quill-pg
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: quill-ingest
        - podSelector:
            matchLabels:
              app: quill-api
      ports:
        - port: 5432
          protocol: TCP
---
# Qdrant: ingress on 6333 (http, used by both clients) from pipeline + api.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quill-qdrant-ingress
